<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page fit the width of a phone screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TenderSathi checks tender documents against your company profile and shows which conditions you meet." />
    <title>TenderSathi · Tender eligibility checker</title>
    <!-- The small icon in the browser tab: the TenderSathi mark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- The Inter font. Without internet the app falls back to the system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved light/dark theme before the page is drawn, so a
         dark page does not flash white while it loads. See src/theme.tsx. -->
    <script>
      try {
        var saved = localStorage.getItem("tendersathi_theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- React draws the whole app inside this element (see src/main.tsx). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
